[workspace]
channels = ["conda-forge"]
name = "tetmag-env"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# convenience tasks
clean = "rm -rf build"
configure = "cmake -S . -B build"
build = "cmake --build build -j"

[dependencies]
cmake = ">=4.3.1,<5"
eigen = ">=3.4.0,<6"
vtk = ">=9.3.1,<10"
pkg-config = ">=0.29.2,<0.30"
gcc = "==14.3"
gxx = ">=14.3.0,<14.4"
boost-cpp = ">=1.85.0,<2"
make = ">=4.4.1,<5"
git = ">=2.53.0,<3"
binutils = ">=2.45.1,<3"
